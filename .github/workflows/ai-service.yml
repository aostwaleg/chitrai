name: AI Service CI (FastAPI / Python)

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/ai-service/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/ai-service/**'

jobs:
  build:
    name: Lint & Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Lint Packages
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Verify Setup
        run: echo "AI Service validation successful."

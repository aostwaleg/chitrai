name: Frontend CI (Expo / React Native Web)

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/frontend/**'
      - 'package.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/frontend/**'
      - 'package.json'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Verify Setup
        run: echo "Frontend build validation successful."

name: Backend CI (Node.js & TypeScript)

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/backend/**'
      - 'package.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/backend/**'
      - 'package.json'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Compile TypeScript
        run: npm run build

      - name: Verify Setup
        run: echo "Backend build validation successful."
